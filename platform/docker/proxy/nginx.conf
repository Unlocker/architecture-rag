# Единственная публикуемая точка стенда, без TLS (TLS и сети — E5.2).
# Адреса upstream задаются переменными и резолвятся при запросе через DNS Docker: так `--scale mcp-server=2`
# подхватывается без перезапуска proxy, а proxy стартует раньше бэкендов.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 8080;

  # Только здоровье самого proxy; бэкенды проверяются их healthcheck.
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /mcp {
    set $mcp http://mcp-server:8080;
    proxy_pass $mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Streamable HTTP: ответы могут идти потоком.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Protected Resource Metadata (RFC 9728): клиенты MCP находят по нему authorization server.
  location /.well-known/oauth-protected-resource {
    set $mcp http://mcp-server:8080;
    proxy_pass $mcp;
    proxy_set_header Host $host;
  }

  # Токены стенда: только endpoint'ы OIDC realm archrag; админка Keycloak наружу не проксируется.
  location /realms/archrag/protocol/openid-connect/ {
    set $kc http://keycloak:8080;
    proxy_pass $kc;
    proxy_set_header Host $host;
  }

  # Webhook источников. /control/snapshot адаптера наружу не публикуется (ограничение UNLOCKER-169).
  location = /webhooks/eam {
    set $up http://adapter-eam:8080;
    rewrite ^ /webhook break;
    proxy_pass $up;
  }
  location = /webhooks/scm {
    set $up http://adapter-scm:8080;
    rewrite ^ /webhook break;
    proxy_pass $up;
  }
  location = /webhooks/cmdb {
    set $up http://adapter-cmdb:8080;
    rewrite ^ /webhook break;
    proxy_pass $up;
  }
  location = /webhooks/deploymap {
    set $up http://adapter-deploymap:8080;
    rewrite ^ /webhook break;
    proxy_pass $up;
  }
}
