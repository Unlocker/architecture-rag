# Демо-стенд PoC (E5.1). Перед запуском: ./mvnw -B -ntp package -DskipTests && cp .env.example .env (см. README).
# Сети edge/backend/graph (default не используется), наружу публикуется только reverse-proxy по TLS.
# Секреты — Docker secrets (из .env), Neo4j: отдельные креденшелы writer и reader, Bolt только по TLS (E5.2).
name: archrag

x-demo-launcher: &demo-launcher
  build:
    context: ../..
    dockerfile: platform/docker/Dockerfile
    args:
      JAR: platform/demo-launcher/target/demo-launcher-0.1.0-SNAPSHOT-exec.jar
  image: archrag/demo-launcher:dev

# Пароли, ключи S3 и секрет webhook приходят как Docker secrets: entrypoint.sh образа экспортирует
# каждый /run/secrets/<ИМЯ> в переменную <ИМЯ>.
x-adapter-env: &adapter-env
  ARCHRAG_PG_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
  ARCHRAG_PG_USER: ${POSTGRES_USER:?}
  ARCHRAG_S3_ENDPOINT: http://seaweedfs:8333
  ARCHRAG_S3_BUCKET: ${S3_BUCKET:?}

x-adapter-secrets: &adapter-secrets
  - { source: pg_password, target: ARCHRAG_PG_PASSWORD }
  - { source: s3_access_key, target: ARCHRAG_S3_ACCESS_KEY }
  - { source: s3_secret_key, target: ARCHRAG_S3_SECRET_KEY }
  - { source: webhook_secret, target: ARCHRAG_WEBHOOK_SECRET }

x-adapter-networks: &adapter-networks
  - edge
  - backend

x-adapter-depends: &adapter-depends
  postgres: { condition: service_healthy }
  seaweedfs: { condition: service_healthy }
  # Миграции журнала (inbox, checkpoints) накатывает ingestion при старте: адаптер до него падает.
  ingestion: { condition: service_healthy }

services:
  # ---- инфраструктура ------------------------------------------------------------------------
  # Одноразовый сервис: демо-CA и серверные сертификаты (proxy, Bolt Neo4j) в volume `certs`. Идемпотентен.
  certs:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    volumes:
      - certs:/certs
      - ca-key:/ca-key
      - ./certs/gen-certs.sh:/gen-certs.sh:ro
    networks: [backend]
    restart: "no"

  neo4j:
    image: neo4j:5-community
    # NEO4J_AUTH собирается из Docker secret при старте и не попадает в Config.Env; затем штатный entrypoint образа.
    entrypoint:
      - /bin/bash
      - -c
      - export NEO4J_AUTH="neo4j/$$(cat /run/secrets/neo4j_password)" && exec tini -g -- /startup/docker-entrypoint.sh "$$@"
      - --
    command: ["neo4j"]
    environment:
      # Bolt только по TLS (сертификат демо-CA из volume certs); Browser (HTTP 7474) наружу не публикуется.
      NEO4J_server_bolt_tls__level: REQUIRED
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /certs/neo4j
      NEO4J_dbms_ssl_policy_bolt_private__key: private.key
      NEO4J_dbms_ssl_policy_bolt_public__certificate: public.crt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE
    secrets:
      - neo4j_password
    volumes:
      - neo4j-data:/data
      # Каталог dump для scripts/backup.sh и restore.sh (E5.4); сам neo4j в него не пишет. Нужен здесь, потому что
      # `docker compose run neo4j` (dump/load) наследует volumes сервиса.
      - backups:/backups
      - certs:/certs:ro
    networks: [graph]
    depends_on:
      certs: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt+ssc://localhost:7687 -u neo4j -p \"$$(cat /run/secrets/neo4j_password)\" 'RETURN 1' >/dev/null"]
      # cypher-shell стартует JVM и под нагрузкой стенда отвечает дольше 10 с: короткий timeout давал ложный unhealthy.
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  # Одноразовый сервис: пользователь archrag_reader для mcp-server. Community не знает ролей, поэтому это только
  # отдельный креденшел (без writer-пароля у MCP), а read-only обеспечивает приложение (read-транзакции).
  neo4j-init:
    image: neo4j:5-community
    entrypoint: ["/bin/bash", "/init-reader.sh"]
    secrets:
      - neo4j_password
      - neo4j_reader_password
    volumes:
      - ./neo4j/init-reader.sh:/init-reader.sh:ro
    networks: [graph]
    restart: "no"
    depends_on:
      neo4j: { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    networks: [backend]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-dir=/data"]
    environment:
      # SeaweedFS берёт единственную identity S3 из этих переменных.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - s3-data:/data
    networks: [backend]
    healthcheck:
      # Любой HTTP-ответ ниже 500 на S3-порту: так же ждёт контейнер ContainersSmokeIT.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -qE 'HTTP/[0-9.]+ [1-4][0-9][0-9]'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Фиксированный hostname: iss токена не зависит от того, через какой адрес его запросили (напрямую или
      # через proxy), и совпадает с ARCHRAG_OIDC_ISSUER_URI сервисов.
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Подстановки в archrag-realm.json.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}
      ARCHRAG_MCP_RESOURCE_URI: https://localhost:${ARCHRAG_PUBLIC_PORT:-8443}/mcp
      ARCHRAG_ADMIN_RESOURCE_URI: urn:archrag:admin
      ARCHRAG_CONSOLE_PORT: ${ARCHRAG_CONSOLE_PORT:-8090}
      ARCHRAG_CONSOLE_RESOURCE_URI: urn:archrag:console
      KEYCLOAK_CONSOLE_USER: ${KEYCLOAK_CONSOLE_USER:?}
      KEYCLOAK_CONSOLE_PASSWORD: ${KEYCLOAK_CONSOLE_PASSWORD:?}
    volumes:
      - ./keycloak/archrag-realm.json:/opt/keycloak/data/import/archrag-realm.json:ro
    # Только loopback: браузер консоли доходит до Keycloak по iss токенов (`keycloak` в /etc/hosts -> 127.0.0.1, см. README).
    # Тот же порт открывает master-админку Keycloak на 127.0.0.1; граница та же, что у Grafana.
    ports:
      - "127.0.0.1:${ARCHRAG_KEYCLOAK_PORT:-8080}:8080"
    # edge: proxy отдаёт токен-endpoint; backend: ingestion и консоль проверяют JWT по issuer.
    networks: [edge, backend]
    healthcheck:
      # В образе нет curl: запрос к management-порту 9000 через /dev/tcp.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": *"UP"' <&3
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s

  # ---- приложения ----------------------------------------------------------------------------
  ingestion:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile
      args:
        JAR: ingestion/ingestion-service/target/ingestion-service-0.1.0-SNAPSHOT-exec.jar
    image: archrag/ingestion:dev
    environment:
      # Audience admin REST: совпадает с `aud`, который keycloak выдаёт токенам со scope architecture.admin.
      ARCHRAG_ADMIN_RESOURCE_URI: urn:archrag:admin
      ARCHRAG_PG_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
      ARCHRAG_PG_USER: ${POSTGRES_USER:?}
      # bolt+ssc: TLS без проверки цепочки (демо-допущение, см. README).
      ARCHRAG_NEO4J_URI: bolt+ssc://neo4j:7687
      ARCHRAG_NEO4J_USER: neo4j
      ARCHRAG_S3_ENDPOINT: http://seaweedfs:8333
      ARCHRAG_S3_BUCKET: ${S3_BUCKET:?}
      ARCHRAG_OIDC_ISSUER_URI: http://keycloak:8080/realms/archrag
      ARCHRAG_EAM_CONTROL_URL: http://adapter-eam:8080/control/snapshot
      ARCHRAG_SCM_CONTROL_URL: http://adapter-scm:8080/control/snapshot
      ARCHRAG_CMDB_CONTROL_URL: http://adapter-cmdb:8080/control/snapshot
      ARCHRAG_DEPLOYMAP_CONTROL_URL: http://adapter-deploymap:8080/control/snapshot
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: ${ARCHRAG_OBSERVABILITY:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
    secrets:
      - { source: pg_password, target: ARCHRAG_PG_PASSWORD }
      - { source: neo4j_password, target: ARCHRAG_NEO4J_PASSWORD }
      - { source: s3_access_key, target: ARCHRAG_S3_ACCESS_KEY }
      - { source: s3_secret_key, target: ARCHRAG_S3_SECRET_KEY }
    # Не в edge: админка ingestion недоступна с proxy.
    networks: [backend, graph, observability]
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      # У ingestion-service нет actuator, а всё кроме /admin закрыто denyAll (401 без токена). Boot открывает порт
      # только после старта контекста (миграции и схема Neo4j уже применены), поэтому любой HTTP-ответ = готов.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mcp-server:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile
      args:
        JAR: access/mcp-server/target/mcp-server-0.1.0-SNAPSHOT-exec.jar
    image: archrag/mcp-server:dev
    # Без container_name и без published ports: сервис масштабируется `--scale mcp-server=2` за proxy.
    environment:
      ARCHRAG_OIDC_ISSUER_URI: http://keycloak:8080/realms/archrag
      ARCHRAG_MCP_RESOURCE_URI: https://localhost:${ARCHRAG_PUBLIC_PORT:-8443}/mcp
      ARCHRAG_NEO4J_READER_URI: bolt+ssc://neo4j:7687
      ARCHRAG_NEO4J_READER_USERNAME: archrag_reader
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: ${ARCHRAG_OBSERVABILITY:-false}
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector:4318/v1/metrics
    # Только reader-пароль; ни writer-пароля, ни PostgreSQL/S3 у MCP нет.
    secrets:
      - { source: neo4j_reader_password, target: ARCHRAG_NEO4J_READER_PASSWORD }
    networks: [edge, graph, observability]
    depends_on:
      neo4j: { condition: service_healthy }
      neo4j-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      # Схему Neo4j создаёт ingestion при старте.
      ingestion: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Одноразовый сервис: пароль read-only роли PostgreSQL archrag_console_ro для admin-console. Роль создаёт миграция V6
  # ingestion, поэтому ждём его готовности. Идемпотентен.
  console-pg-init:
    image: postgres:16
    entrypoint: ["/bin/bash", "/init-console-ro.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    secrets:
      - pg_password
      - console_pg_password
    volumes:
      - ./postgres/init-console-ro.sh:/init-console-ro.sh:ro
    networks: [backend]
    restart: "no"
    depends_on:
      ingestion: { condition: service_healthy }

  # Админ-консоль (read-only): граф под reader-учёткой и журнал под archrag_console_ro. Writer-секретов нет. Порт только
  # на loopback и не публикуется через reverse-proxy (ADR 0026).
  admin-console:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile
      args:
        JAR: access/admin-console/target/admin-console-0.1.0-SNAPSHOT-exec.jar
    image: archrag/admin-console:dev
    environment:
      ARCHRAG_OIDC_ISSUER_URI: http://keycloak:8080/realms/archrag
      ARCHRAG_CONSOLE_RESOURCE_URI: urn:archrag:console
      ARCHRAG_NEO4J_READER_URI: bolt+ssc://neo4j:7687
      ARCHRAG_NEO4J_READER_USERNAME: archrag_reader
      ARCHRAG_CONSOLE_PG_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
    secrets:
      - { source: neo4j_reader_password, target: ARCHRAG_NEO4J_READER_PASSWORD }
      - { source: console_pg_password, target: ARCHRAG_CONSOLE_PG_PASSWORD }
    # backend: PostgreSQL и JWKS Keycloak; graph: Neo4j; console-edge: только публикация порта на loopback.
    networks: [backend, graph, console-edge]
    ports:
      - "127.0.0.1:${ARCHRAG_CONSOLE_PORT:-8090}:8080"
    depends_on:
      neo4j: { condition: service_healthy }
      neo4j-init: { condition: service_completed_successfully }
      console-pg-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      ingestion: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Адаптер каждого источника — ровно один экземпляр: замок snapshot в Poller действует только внутри процесса.
  adapter-eam:
    <<: *demo-launcher
    command: ["adapter", "EAM"]
    secrets: *adapter-secrets
    networks: *adapter-networks
    environment:
      <<: *adapter-env
      ARCHRAG_SOURCE_URL: http://stub-eam:8080
    depends_on:
      <<: *adapter-depends
      stub-eam: { condition: service_healthy }
    deploy: { replicas: 1 }
    healthcheck: &adapter-health
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  adapter-scm:
    <<: *demo-launcher
    command: ["adapter", "SCM"]
    secrets: *adapter-secrets
    networks: *adapter-networks
    environment:
      <<: *adapter-env
      ARCHRAG_SOURCE_URL: http://stub-scm:8080
    depends_on:
      <<: *adapter-depends
      stub-scm: { condition: service_healthy }
    deploy: { replicas: 1 }
    healthcheck: *adapter-health

  adapter-cmdb:
    <<: *demo-launcher
    command: ["adapter", "CMDB"]
    secrets: *adapter-secrets
    networks: *adapter-networks
    environment:
      <<: *adapter-env
      ARCHRAG_SOURCE_URL: http://stub-cmdb:8080
    depends_on:
      <<: *adapter-depends
      stub-cmdb: { condition: service_healthy }
    deploy: { replicas: 1 }
    healthcheck: *adapter-health

  adapter-deploymap:
    <<: *demo-launcher
    command: ["adapter", "DEPLOY_MAP"]
    secrets: *adapter-secrets
    networks: *adapter-networks
    environment:
      <<: *adapter-env
      ARCHRAG_SOURCE_URL: http://stub-deploymap:8080
    depends_on:
      <<: *adapter-depends
      stub-deploymap: { condition: service_healthy }
    deploy: { replicas: 1 }
    healthcheck: *adapter-health

  # ---- заглушки мастер-систем (seed из StubSources) -------------------------------------------
  stub-eam:
    <<: *demo-launcher
    command: ["stub", "EAM"]
    networks: [edge]
    # Webhook напрямую адаптеру внутри edge (демо-допущение: «внешняя система» — тот же стенд, TLS-proxy не нужен).
    environment:
      ARCHRAG_WEBHOOK_TARGET: http://adapter-eam:8080/webhook
    secrets:
      - { source: webhook_secret, target: ARCHRAG_WEBHOOK_SECRET }
    healthcheck: &stub-health
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:8080/changes?limit=1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  stub-scm:
    <<: *demo-launcher
    command: ["stub", "SCM"]
    networks: [edge]
    # Webhook напрямую адаптеру внутри edge (демо-допущение: «внешняя система» — тот же стенд, TLS-proxy не нужен).
    environment:
      ARCHRAG_WEBHOOK_TARGET: http://adapter-scm:8080/webhook
    secrets:
      - { source: webhook_secret, target: ARCHRAG_WEBHOOK_SECRET }
    healthcheck: *stub-health

  stub-cmdb:
    <<: *demo-launcher
    command: ["stub", "CMDB"]
    networks: [edge]
    # Webhook напрямую адаптеру внутри edge (демо-допущение: «внешняя система» — тот же стенд, TLS-proxy не нужен).
    environment:
      ARCHRAG_WEBHOOK_TARGET: http://adapter-cmdb:8080/webhook
    secrets:
      - { source: webhook_secret, target: ARCHRAG_WEBHOOK_SECRET }
    healthcheck: *stub-health

  stub-deploymap:
    <<: *demo-launcher
    command: ["stub", "DEPLOY_MAP"]
    networks: [edge]
    # Webhook напрямую адаптеру внутри edge (демо-допущение: «внешняя система» — тот же стенд, TLS-proxy не нужен).
    environment:
      ARCHRAG_WEBHOOK_TARGET: http://adapter-deploymap:8080/webhook
    secrets:
      - { source: webhook_secret, target: ARCHRAG_WEBHOOK_SECRET }
    healthcheck: *stub-health

  # Заглушка EAM в формате реального API (docs/eam-api.yaml): рядом со старой stub-eam, которую по-прежнему читает
  # adapter-eam. К новой заглушке адаптер не подключён (переделка адаптера — отдельная задача). Порт на хост не
  # публикуется: curl изнутри, см. README. Токен Authorization: Token приходит как Docker secret.
  eam-api-stub:
    <<: *demo-launcher
    command: ["eam-api-stub"]
    networks: [edge]
    secrets:
      - { source: eam_api_token, target: ARCHRAG_EAM_API_TOKEN }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -H \"Authorization: Token $$(cat /run/secrets/ARCHRAG_EAM_API_TOKEN)\" 'http://127.0.0.1:8080/api/platforms/?page_size=1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---- единственная публикуемая точка ---------------------------------------------------------
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${ARCHRAG_PUBLIC_PORT:-8443}:8443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
    networks: [edge]
    depends_on:
      certs: { condition: service_completed_successfully }
      mcp-server: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      adapter-eam: { condition: service_healthy }
      adapter-scm: { condition: service_healthy }
      adapter-cmdb: { condition: service_healthy }
      adapter-deploymap: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- наблюдаемость (профиль observability, E5.3) ---------------------------------------------
  # Сервисы пушат метрики в collector по OTLP (включается ARCHRAG_OBSERVABILITY=true), Prometheus скрейпит
  # только collector. На хост публикуется только Grafana (loopback).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.140.1
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    networks: [observability]
    # Образ без shell и wget: проверка изнутри невозможна. Готовность collector проверяет healthcheck prometheus
    # (цель otel-collector:8889 в состоянии up), а prometheus ждёт его по depends_on: service_started.

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    depends_on:
      otel-collector: { condition: service_started }
    healthcheck:
      # Цель collector должна быть up: так проверяется и сам collector.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:9090/api/v1/targets?state=active' | grep -q '\"health\":\"up\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    # observability: доступ к Prometheus; obs-edge не internal, иначе публикация порта не работает.
    networks: [observability, obs-edge]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

networks:
  # Proxy, MCP, Keycloak, адаптеры и заглушки (заглушки изображают внешние мастер-системы). Не internal.
  edge:
  # Сервисы <-> PostgreSQL/SeaweedFS. Без внешнего доступа.
  backend:
    internal: true
  # Сервисы <-> Neo4j. Без внешнего доступа.
  graph:
    internal: true
  # Метрики: mcp-server, ingestion, collector, Prometheus, Grafana. Без внешнего доступа.
  observability:
    internal: true
  # Только для публикации порта Grafana на loopback (internal-сеть порты не публикует).
  obs-edge:
  # Только для публикации порта админ-консоли на loopback (internal-сеть порты не публикует).
  console-edge:

# Значения берутся из .env (вне Git); внутри контейнера это файлы /run/secrets/<target>, а не переменные окружения.
secrets:
  pg_password:
    environment: POSTGRES_PASSWORD
  neo4j_password:
    environment: NEO4J_PASSWORD
  neo4j_reader_password:
    environment: NEO4J_READER_PASSWORD
  s3_access_key:
    environment: S3_ACCESS_KEY
  s3_secret_key:
    environment: S3_SECRET_KEY
  webhook_secret:
    environment: WEBHOOK_SECRET
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  eam_api_token:
    environment: EAM_API_TOKEN
  console_pg_password:
    environment: CONSOLE_PG_PASSWORD

volumes:
  certs:
  ca-key:
  neo4j-data:
  backups:
  pg-data:
  s3-data:
  prometheus-data:
  grafana-data:
