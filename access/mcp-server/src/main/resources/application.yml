spring:
  application:
    name: arch-rag
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ai:
    mcp:
      server:
        name: arch-rag
        version: 0.1.0
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ARCHRAG_OIDC_ISSUER_URI}
          audiences: ${archrag.mcp.security.resource-uri}

archrag:
  mcp:
    security:
      resource-uri: ${ARCHRAG_MCP_RESOURCE_URI}
      max-request-bytes: 1MB
      # Каждый tool обязан иметь строку: tool без записи отклоняется (fail-closed).
      tool-scopes:
        ping: architecture.read
        find_runtime_footprint: architecture.read
        search_assets: architecture.read
        get_asset: architecture.read
        explain_provenance: architecture.read
        trace_dependencies: architecture.read

  neo4j:
    reader:
      # Отдельно от writer-свойств projector; пароль только из env/Docker secret.
      uri: ${ARCHRAG_NEO4J_READER_URI}
      username: ${ARCHRAG_NEO4J_READER_USERNAME}
      password: ${ARCHRAG_NEO4J_READER_PASSWORD}
  query:
    # Порог устаревания фактов (lastSeenAt старше → stale).
    stale-after: P7D
    limits:
      max-depth: 6
      max-nodes: 500
      max-paths: 50
      timeout: 5s
      max-response-bytes: 512KB

server:
  shutdown: graceful

management:
  # OTLP push в otel-collector (E5.3). Выключен по умолчанию: без профиля observability collector'а нет.
  # Включение и адрес приходят из compose: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED / ..._URL.
  otlp:
    metrics:
      export:
        enabled: false
        step: 10s
  opentelemetry:
    resource-attributes:
      service.name: mcp-server
      # Два экземпляра за --scale иначе сольются в одну серию.
      service.instance.id: ${HOSTNAME:local}
  metrics:
    distribution:
      # Гистограмма нужна для p95 latency по tool (критерий 9).
      percentiles-histogram:
        archrag.mcp.tool.call: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
