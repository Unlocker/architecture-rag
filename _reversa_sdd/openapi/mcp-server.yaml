# Источник: _reversa_sdd/mcp-server/contracts.md. MCP поверх Streamable HTTP (режим STATELESS): единственная ручка POST /mcp (JSON-RPC 2.0).
openapi: 3.0.3
info:
  title: Arch RAG MCP server
  version: "0.1.0"
  description: >
    JSON-RPC методы: initialize, tools/list, tools/call. Scope architecture.read проверяется только для tools/call
    (ToolScopeFilter). Tools: ping, search_assets, get_asset, explain_provenance, trace_dependencies, find_runtime_footprint.
    Все tools read-only. Ошибки валидации tool: HTTP 200, result.isError=true.
servers:
  - url: https://localhost:8443
paths:
  /mcp:
    post:
      summary: JSON-RPC вызов MCP
      x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/security/ToolScopeFilter.java:56-98
      security:
        - bearer: [architecture.read]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JsonRpcRequest"}
      responses:
        "200": {description: "JSON-RPC ответ; для tools/call result.content[0].text — JSON-строка результата"}
        "400": {description: "неверная кодировка, невалидный JSON, не объект или batch"}
        "401": {description: нет или неверный токен}
        "403": {description: "нет scope либо неизвестный tool (WWW-Authenticate insufficient_scope)"}
        "413": {description: тело больше max-request-bytes (1MB)}
  /.well-known/oauth-protected-resource:
    get:
      summary: RFC 9728 метаданные защищаемого ресурса (публично)
      security: []
      x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/security/McpSecurityConfiguration.java:43-60
      responses:
        "200": {description: "resource, authorization_servers, scopes_supported, bearer_methods_supported, resource_name"}
  /actuator/health/{group}:
    get:
      summary: liveness/readiness (публично)
      security: []
      x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/security/McpSecurityConfiguration.java:43-45
      parameters:
        - {name: group, in: path, required: true, schema: {type: string, enum: [liveness, readiness]}}
      responses:
        "200": {description: UP}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: {type: string, enum: ["2.0"]}
        id: {oneOf: [{type: string}, {type: integer}]}
        method: {type: string, enum: [initialize, tools/list, tools/call]}
        params: {type: object, additionalProperties: true}
    ToolArguments:
      description: "params.arguments для tools/call, по имени tool"
      oneOf:
        - title: ping (аргументов нет)
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/PingTool.java:11-22
          type: object
        - title: search_assets
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/SearchAssetsTool.java:39-93
          type: object
          required: [query]
          properties:
            query: {type: string, maxLength: 200}
            types: {type: array, items: {type: string, enum: [ITSystem, Service, Repository, Team, Environment, Deployment, ComputeInstance]}}
            environment: {type: string}
            limit: {type: integer, minimum: 1, maximum: 50, default: 10}
        - title: get_asset
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/GetAssetTool.java:42-92
          type: object
          required: [gid]
          properties:
            gid: {type: string, format: uuid}
            includeRelations: {type: boolean, default: true}
        - title: explain_provenance
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/ExplainProvenanceTool.java:41-88
          type: object
          required: [gid]
          properties:
            gid: {type: string, format: uuid}
            property: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        - title: trace_dependencies
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/TraceDependenciesTool.java:82-158
          type: object
          required: [gid]
          properties:
            gid: {type: string, format: uuid}
            direction: {type: string, enum: [upstream, downstream], default: downstream}
            maxDepth: {type: integer, minimum: 1, maximum: 6}
            relationTypes: {type: array, items: {type: string}}
            mode: {type: string, enum: [trace, impact], default: trace}
            environment: {type: string, maxLength: 128}
        - title: find_runtime_footprint
          x-source: access/mcp-server/src/main/java/io/github/unlocker/archrag/mcpserver/tools/FindRuntimeFootprintTool.java:46-77
          type: object
          required: [systemGid]
          properties:
            systemGid: {type: string, format: uuid}
            environment: {type: string}
