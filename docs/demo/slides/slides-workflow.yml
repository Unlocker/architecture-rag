# Не подключён автоматически: у токена агента нет scope `workflow`. Скопировать как .github/workflows/slides.yml.
name: Slides

# Beamer-презентация docs/demo/slides (DEMO.7). PDF не коммитится: собирается здесь и публикуется артефактом.
on:
  pull_request:
    paths: ['docs/demo/**', '.github/workflows/slides.yml', 'platform/docker/demo/expected/**']
  push:
    branches: [develop, main, 'epic/**']
    paths: ['docs/demo/**', '.github/workflows/slides.yml', 'platform/docker/demo/expected/**']

concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  figures:
    # Кадры graph.html делает headless Chrome: в контейнере TeX Live его нет, поэтому отдельный job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docs/demo/slides/make-figures.sh
        env:
          CHROME: google-chrome
      - uses: actions/upload-artifact@v7
        with:
          name: slides-figures
          path: docs/demo/slides/images/generated
          if-no-files-found: error

  slides:
    needs: figures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: slides-figures
          path: docs/demo/slides/images/generated
      - name: Зависимости (latexminted, jq)
        run: |
          apt-get update && apt-get install -y --no-install-recommends jq python3-pip
          pip install --break-system-packages latexminted
      - run: SKIP_FIGURES=1 docs/demo/slides/make-slides.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch-rag-slides
          path: docs/demo/slides/out/*.pdf
          if-no-files-found: error
