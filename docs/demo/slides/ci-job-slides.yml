# Job `slides` для .github/workflows/ci.yml (секция jobs:), рядом с build, integration-tests и docker-stand.
# Не добавлен автоматически: у токена агента нет scope `workflow`. Вставить как есть; существующие jobs не меняются.
# Кадры (docs/demo/slides/figures/*.png) лежат в Git, job только собирает LaTeX.
  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      - name: latexminted для minted v3
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-pip
          pip install --break-system-packages latexminted
      - run: docs/demo/slides/make-slides.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arch-rag-slides
          path: |
            docs/demo/slides/main.pdf
            docs/demo/slides/main-notes.pdf
          if-no-files-found: error
