        (ТЗ-0041 rework). kind=groups → группы типа (type_groups), kind=fields → поля
        типа (type_fields), kind=computed → вычисляемые поля (type_computed, cr_*/cw_*),
        kind=system → системные вычисляемые поля (eam_id/eam_name/eam_permalink, ТЗ-0047).
