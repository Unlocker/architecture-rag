  /api/types/{type_id}/grids/{grid_key}/convert/:
    post:
      operationId: types_grids_convert_create
      description: |-
        POST /api/types/<type_id>/grids/<grid_key>/convert/ (ТЗ-0046 §3.1).

        Конвертация источника грида: forward — файл -> БД (создание/обновление
        строки type_grids + sync), backward — БД -> файл (только JS-скаффолд,
        мутаций нет). Только ReadWriteAdmin: DRF отдаёт 401 (unauth) / 403 (RO, RW).
        Тело без `direction` или с иным значением -> 400; нет типа/грида -> 404;
        неконвертируемый грид (forward) -> 409 с `complex_reasons` (что мешает).
      parameters:
      - in: path
        name: grid_key
        schema:
          type: string
        required: true
      - in: path
        name: type_id
        schema:
          type: integer
        required: true
      tags:
      - types
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
