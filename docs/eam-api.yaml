      - in: query
        name: filter_field
        schema:
          type: string
        description: Имя поля обратной ссылки для фильтра (ТЗ-0009)
      - in: query
        name: filter_value
        schema:
          type: integer
        description: ID текущего объекта для фильтра filter_field
      - in: query
