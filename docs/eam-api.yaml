openapi: 3.0.3
info:
  title: EAM Tool API
  version: '0.4'
  description: API для управления корпоративной архитектурой
  contact:
    email: anybody@example.com
paths:
  /api/akmb/:
    get:
      operationId: akmb_list
      description: Возвращает список объектов с поддержкой поиска, фильтрации и обогащения
        (через QueryBus).
      parameters:
      - in: query
        name: enrich
        schema:
          type: boolean
        description: Включить серверное обогащение (1/0)
      - in: query
        name: fields
        schema:
          type: string
        description: Список полей через запятую
      - in: query
        name: only_names
        schema:
          type: boolean
        description: Ограничить поиск только полем name (1/0)
      - in: query
        name: page
        schema:
          type: integer
        description: Номер страницы
      - in: query
        name: page_size
        schema:
          type: integer
        description: Размер страницы
      - in: query
        name: search
        schema:
          type: string
        description: Поисковая строка
      - in: query
        name: search_by
        schema:
          type: string
        description: Поля поиска через запятую
      - in: query
        name: search_mode
        schema:
          type: string
          enum:
          - contains
          - exact
          - regex
        description: 'Режим поиска: contains (по умолчанию), exact, regex'
      - in: query
        name: sort
        schema:
          type: string
        description: 'Сортировка: ''поле'', ''-поле'' (desc), список через запятую.
          Колонки (id, ctime, mtime) или поля схемы; по умолчанию - дефолт типа'
      tags:
      - akmb
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchObject'
          description: ''
    post:
      operationId: akmb_create
      description: |-
        Создаёт новый объект через API (для jsGrid insertItem).

        Не-администраторы на типах с согласованием сохраняют прежний контракт —
        черновик в буфер (SuperView.create); остальные случаи создают объект напрямую.
        Ответ несёт id созданного объекта для клиентского грида.
      tags:
      - akmb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchObject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchObject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchObject'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchObject'
          description: ''
  /api/akmb/{id}/:
    get:
      operationId: akmb_retrieve
      description: Возвращает один объект по ID с возможностью указать версию (через
        QueryBus).
      parameters:
      - in: query
        name: enrich
        schema:
          type: boolean
        description: Включить серверное обогащение (1/0)
      - in: query
        name: fields
        schema:
          type: string
        description: Список полей через запятую
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - akmb
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchObject'
          description: ''
    patch:
      operationId: akmb_partial_update
      description: Частичное обновление через буфер для не-админов (через CommandBus).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - akmb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArchObject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArchObject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArchObject'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchObject'
          description: ''
  /api/akmb/{id}/archive/:
    post:
      operationId: akmb_archive_create
      description: 'ТЗ-0040 §3.3: предложение перевода объекта в архив (ProposeArchiveCommand)
        — буфер с маркером to_archive, объект в main не изменяется. Права: ReadWriteAdmin.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - akmb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchObject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArchObject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArchObject'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Объект помечен к архиву
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
  /api/akmb/{id}/draft/:
    post:
      operationId: akmb_draft_create_2
      description: 'ТЗ-0040: in-place update грида при requires_approval — сохранение
        черновика существующего объекта (SaveDraftCommand). Тело: attrs объекта.'
