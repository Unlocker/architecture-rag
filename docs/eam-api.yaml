components:
  schemas:
    ArchObject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attrs: {}
        ver:
          type: integer
        datetime:
          type: string
          format: date-time
      required:
      - attrs
      - id
      - ver
    Buffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type_id:
          type: integer
        object_id:
          type: integer
        attrs: {}
        ver:
          type: integer
        operation:
          type: string
        state:
          type: string
      required:
      - id
    PatchedArchObject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attrs: {}
        ver:
          type: integer
        datetime:
          type: string
          format: date-time
    PatchedBuffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type_id:
          type: integer
        object_id:
          type: integer
        attrs: {}
        ver:
          type: integer
        operation:
          type: string
        state:
          type: string
    PatchedScheduler:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        type_id:
          type: integer
        object_id:
          type: integer
        attrs_diff: {}
        new_ver:
          type: integer
        old_ver:
          type: integer
        state:
          type: string
        datetime:
          type: string
          format: date-time
    Scheduler:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        type_id:
          type: integer
        object_id:
          type: integer
        attrs_diff: {}
        new_ver:
          type: integer
        old_ver:
          type: integer
        state:
          type: string
        datetime:
          type: string
          format: date-time
      required:
      - attrs_diff
      - datetime
      - id
      - name
      - new_ver
      - object_id
      - old_ver
      - state
      - type_id
    files:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        filename:
          type: string
          maxLength: 255
        file:
          type: string
          format: uri
      required:
      - file
      - filename
      - id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
